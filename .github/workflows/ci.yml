name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  api-tests:
    name: certify-api tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: certify-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: certify-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The test suite imports @prisma/client (PrismaClient is instantiated at
      # module load); generate the client. No database is needed — the tests
      # isolate the DB with an in-memory Prisma fake.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

  web-tests:
    name: certify-web tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: certify-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: certify-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
