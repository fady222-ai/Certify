# railway.toml — إعدادات نشر سيرفر الكيان على Railway
# كل كيان يستخدم نفس هذا الملف في نسخته المستقلة

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node app.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# ── متغيرات البيئة الافتراضية ─────────────────────────────
# القيم الفعلية تُضبط في لوحة Railway Variables لكل كيان
[deploy.environmentVariables]
PORT = "3000"
PERSISTENT_DIR = "/data"
NODE_ENV = "production"
# CENTRAL_SERVER_URL  ← يُضبط يدوياً في Railway Variables
# ADMIN_SESSION_TTL   ← اختياري، افتراضي 8 ساعات
# MAX_FILE_MB         ← اختياري، افتراضي 5

# ── التخزين الثابت (Persistent Volume) ───────────────────
# أضف Volume في Railway وارتبطه على المسار /data
# هذا يحفظ قاعدة البيانات والملفات عبر عمليات إعادة النشر
[[volumes]]
mountPath = "/data"
